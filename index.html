<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTIME — Handcrafted Wall Clocks</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- GATE -->
<div class="gate-wrap" id="gateWrap">
  <div class="gate-card">
    <img src="images/logo.jpg" class="gate-logo" alt="ARTIME">
    <div class="gate-title">Fine Handcrafted Clocks</div>
    <h1 class="gate-sub">Enter your access code</h1>
    <input type="password" id="pwInput" placeholder="Access code" autocomplete="off">
    <button onclick="tryLogin()">View Catalog</button>
    <div class="gate-error" id="gateError"></div>
    <div class="gate-footer">Each customer type has its own code that shows the correct pricing.</div>
  </div>
</div>

<!-- CATALOG -->
<div id="catalogWrap" style="display:none;">
  <header class="site-header">
    <div class="brand">
      <img src="images/logo.jpg" alt="ARTIME">
      <div class="names">
        <div class="collection">Fine Handcrafted Clocks</div>
        <div class="company">ARTIME</div>
      </div>
    </div>
    <div class="header-right">
      <span class="tier-badge" id="tierBadge"></span>
      <button class="logout-btn" onclick="logout()">Switch code</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="searchBox" placeholder="Search products…" oninput="render()">
    <select id="collectionFilter" onchange="render()"><option value="">All collections</option></select>
    <select id="finishFilter" onchange="render()"><option value="">All finishes</option></select>
    <select id="patternFilter" onchange="render()"><option value="">All patterns</option></select>
    <select id="sizeFilter" onchange="render()"><option value="">All sizes</option></select>
  </div>
  <p class="result-count" id="resultCount"></p>

  <div class="catalog-grid" id="grid"></div>
</div>

<!-- CART BAR (sticky) -->
<div class="cart-bar" id="cartBar">
  <div class="cart-bar-info">
    <span id="cartCount">0 items</span> · <span id="cartBarTotal">₹0</span>
  </div>
  <button class="btn-view-order" onclick="openCartReview()">View & Place Order</button>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
  <button class="lightbox-nav prev" onclick="navLightbox(event,-1)">&#8249;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav next" onclick="navLightbox(event,1)">&#8250;</button>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<!-- ORDER REVIEW MODAL -->
<div class="order-modal" id="orderModal">
  <div class="order-modal-card">
    <div class="order-modal-header">
      <h2>Review your order</h2>
      <button class="order-close" onclick="closeOrderReview()">&times;</button>
    </div>
    <div class="order-modal-body" id="orderReviewBody"></div>
    <div class="order-modal-footer">
      <div class="order-total" id="orderTotal"></div>
      <button class="btn-whatsapp" onclick="sendOrderToWhatsApp()">Send order on WhatsApp</button>
    </div>
  </div>
</div>
<div class="added-toast" id="addedToast"></div>

<script src="app.js"></script>
<script>
let PRODUCTS = [];
let TIER_LABEL = "";
let lightboxImages = [];
let lightboxIndex = 0;
let CART = []; // [{code,title,size,finish,price,qty}]

function loadCart() {
  try {
    const saved = sessionStorage.getItem('artime_cart');
    CART = saved ? JSON.parse(saved) : [];
  } catch (e) { CART = []; }
}
function saveCart() {
  sessionStorage.setItem('artime_cart', JSON.stringify(CART));
}
function cartTotal() {
  return CART.reduce((sum, i) => sum + i.price * i.qty, 0);
}
function updateCartBar() {
  const bar = document.getElementById('cartBar');
  const count = CART.reduce((n, i) => n + i.qty, 0);
  if (count === 0) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  document.getElementById('cartCount').textContent = `${count} item${count !== 1 ? 's' : ''}`;
  document.getElementById('cartBarTotal').textContent = money(cartTotal()) + ' + GST';
}

async function tryLogin() {
  const pw = document.getElementById('pwInput').value.trim();
  const errEl = document.getElementById('gateError');
  errEl.textContent = '';
  if (!pw) { errEl.textContent = 'Please enter your access code.'; return; }
  errEl.textContent = 'Checking…';
  try {
    const res = await apiPost('/login', { password: pw });
    if (!res.ok) { errEl.textContent = res.error || 'Incorrect code.'; return; }
    PRODUCTS = res.products;
    TIER_LABEL = res.tierLabel;
    sessionStorage.setItem('artime_pw', pw);
    showCatalog();
  } catch (e) {
    errEl.textContent = 'Could not reach the server. Please try again.';
  }
}

function logout() {
  sessionStorage.removeItem('artime_pw');
  location.reload();
}

function populateFilters() {
  const collections = [...new Set(PRODUCTS.map(p => p.collection).filter(Boolean))].sort();
  const finishes = [...new Set(PRODUCTS.map(p => p.finish))].sort();
  const patterns = [...new Set(PRODUCTS.map(p => p.pattern))].sort();
  const sizes = [...new Set(PRODUCTS.map(p => p.size))].sort();
  const cSel = document.getElementById('collectionFilter');
  const fSel = document.getElementById('finishFilter');
  const pSel = document.getElementById('patternFilter');
  const sSel = document.getElementById('sizeFilter');
  collections.forEach(c => cSel.innerHTML += `<option value="${c}">${c}</option>`);
  finishes.forEach(f => fSel.innerHTML += `<option value="${f}">${f}</option>`);
  patterns.forEach(p => pSel.innerHTML += `<option value="${p}">${p}</option>`);
  sizes.forEach(s => sSel.innerHTML += `<option value="${s}">${s}</option>`);
}

function render() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const cF = document.getElementById('collectionFilter').value;
  const fF = document.getElementById('finishFilter').value;
  const pF = document.getElementById('patternFilter').value;
  const sF = document.getElementById('sizeFilter').value;

  const items = PRODUCTS.filter(p => {
    if (cF && p.collection !== cF) return false;
    if (fF && p.finish !== fF) return false;
    if (pF && p.pattern !== pF) return false;
    if (sF && p.size !== sF) return false;
    if (q && !(p.title.toLowerCase().includes(q) || p.code.toLowerCase().includes(q))) return false;
    return true;
  });

  document.getElementById('resultCount').textContent = `${items.length} product${items.length !== 1 ? 's' : ''}`;

  const grid = document.getElementById('grid');
  if (items.length === 0) {
    grid.innerHTML = '<div class="empty-state">No products match your search.</div>';
    return;
  }

  grid.innerHTML = items.map((p, pIdx) => {
    const imgs = p.images.filter(Boolean);
    const [hero, t1, t2] = p.images;
    const imgsJson = JSON.stringify(imgs).replace(/"/g, '&quot;');
    const safeId = p.code.replace(/[^a-zA-Z0-9]/g, '_');
    return `
    <div class="product-card">
      <div class="product-hero" onclick='openLightbox(${imgsJson}, 0, ${JSON.stringify(p.title).replace(/'/g, "&#39;")})'>
        <img src="${hero || ''}" alt="${p.title}" loading="lazy">
        <div class="zoom-hint">🔍 Click to zoom</div>
      </div>
      <div class="product-body">
        <div class="product-eyebrow">${p.collection} · ${p.code}</div>
        <h3 class="product-title">${p.title}</h3>
        <p class="product-desc">${p.description}</p>
        <div class="chip-row">
          <span class="chip">Size: ${p.size}</span>
          <span class="chip">${p.finish}</span>
        </div>
        <div class="price-row">${money(p.price)} <span class="gst">+ GST</span></div>
        <div class="highlights-label">Product Highlights</div>
        <ul class="highlights-list">${p.highlights.map(h => `<li>${h}</li>`).join('')}</ul>
        <div class="thumb-row">
          ${t1 ? `<img src="${t1}" alt="detail" onclick='event.stopPropagation(); openLightbox(${imgsJson}, 1, ${JSON.stringify(p.title).replace(/'/g, "&#39;")})'>` : ''}
          ${t2 ? `<img src="${t2}" alt="detail" onclick='event.stopPropagation(); openLightbox(${imgsJson}, 2, ${JSON.stringify(p.title).replace(/'/g, "&#39;")})'>` : ''}
        </div>
        <div class="order-row">
          <label class="qty-label">Qty
            <input type="number" min="1" value="1" class="qty-input" id="qty_${safeId}">
          </label>
          <button class="btn-order" id="addbtn_${safeId}" onclick="addToCart('${p.code}')">Add</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ---------- Cart flow ---------- */
function addToCart(code) {
  const p = PRODUCTS.find(x => x.code === code);
  if (!p) return;
  const safeId = code.replace(/[^a-zA-Z0-9]/g, '_');
  const qtyEl = document.getElementById('qty_' + safeId);
  let qty = parseInt(qtyEl.value, 10);
  if (!qty || qty < 1) qty = 1;

  const existing = CART.find(i => i.code === code);
  if (existing) {
    existing.qty += qty;
  } else {
    CART.push({ code: p.code, title: p.title, size: p.size, finish: p.finish, price: p.price, qty });
  }
  saveCart();
  updateCartBar();
  showAddedToast(`${p.title} added`);
}

function showAddedToast(msg) {
  const t = document.getElementById('addedToast');
  t.textContent = '✓ ' + msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function removeFromCart(code) {
  CART = CART.filter(i => i.code !== code);
  saveCart();
  updateCartBar();
  if (CART.length === 0) { closeOrderReview(); return; }
  renderCartReview();
}

function updateCartQty(code, val) {
  let qty = parseInt(val, 10);
  if (!qty || qty < 1) qty = 1;
  const item = CART.find(i => i.code === code);
  if (item) item.qty = qty;
  saveCart();
  updateCartBar();
  renderCartReview();
}

function openCartReview() {
  if (CART.length === 0) return;
  renderCartReview();
  document.getElementById('orderModal').classList.add('open');
}

function renderCartReview() {
  document.getElementById('orderReviewBody').innerHTML = CART.map(o => {
    const lineTotal = o.price * o.qty;
    return `
    <div class="order-line">
      <div class="order-line-main">
        <div class="order-line-title">${o.title}</div>
        <div class="order-line-meta">${o.finish} · ${o.size} · Code: ${o.code}</div>
      </div>
      <div class="order-line-qty">
        Qty: <input type="number" min="1" value="${o.qty}" onchange="updateCartQty('${o.code}', this.value)">
      </div>
      <div class="order-line-price">${money(lineTotal)} + GST</div>
      <button class="order-line-remove" onclick="removeFromCart('${o.code}')" title="Remove">&times;</button>
    </div>`;
  }).join('');
  document.getElementById('orderTotal').textContent = 'Total: ' + money(cartTotal()) + ' + GST';
}

function closeOrderReview() {
  document.getElementById('orderModal').classList.remove('open');
}

function sendOrderToWhatsApp() {
  if (CART.length === 0) return;
  const lines = [`Hi ARTIME, I'd like to place an order:`, ``];
  CART.forEach((o, i) => {
    const lineTotal = o.price * o.qty;
    lines.push(`${i + 1}. ${o.title}`);
    lines.push(`   Finish: ${o.finish} | Size: ${o.size} | Code: ${o.code}`);
    lines.push(`   Quantity: ${o.qty} × ${money(o.price)} = ${money(lineTotal)} + GST`);
    lines.push(``);
  });
  lines.push(`Grand Total: ${money(cartTotal())} + GST`);
  lines.push(``);
  lines.push(`(Sent from the ${TIER_LABEL} catalog)`);

  const text = encodeURIComponent(lines.join('\n'));
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${text}`;
  window.open(url, '_blank');

  CART = [];
  saveCart();
  updateCartBar();
  closeOrderReview();
}

/* ---------- Lightbox ---------- */
function openLightbox(imgs, idx, title) {
  lightboxImages = imgs;
  lightboxIndex = idx;
  document.getElementById('lightboxImg').src = imgs[idx];
  document.getElementById('lightboxCaption').textContent = `${title} — photo ${idx+1} of ${imgs.length}`;
  document.getElementById('lightbox').classList.add('open');
  document.querySelectorAll('.lightbox-nav').forEach(b => b.style.display = imgs.length > 1 ? 'flex' : 'none');
}
function closeLightbox(e) {
  if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-close')) {
    document.getElementById('lightbox').classList.remove('open');
  }
}
function navLightbox(e, dir) {
  e.stopPropagation();
  lightboxIndex = (lightboxIndex + dir + lightboxImages.length) % lightboxImages.length;
  document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
  const cap = document.getElementById('lightboxCaption').textContent.split(' — ')[0];
  document.getElementById('lightboxCaption').textContent = `${cap} — photo ${lightboxIndex+1} of ${lightboxImages.length}`;
}
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').classList.contains('open')) {
    if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
    if (e.key === 'ArrowRight') navLightbox(e, 1);
    if (e.key === 'ArrowLeft') navLightbox(e, -1);
  }
  if (e.key === 'Escape' && document.getElementById('orderModal').classList.contains('open')) {
    closeOrderReview();
  }
});

function showCatalog() {
  document.getElementById('gateWrap').style.display = 'none';
  document.getElementById('catalogWrap').style.display = 'block';
  document.getElementById('tierBadge').textContent = TIER_LABEL + ' pricing';
  populateFilters();
  render();
}

(async function init() {
  loadCart();
  updateCartBar();
  const savedPw = sessionStorage.getItem('artime_pw');
  if (savedPw) {
    try {
      const res = await apiPost('/login', { password: savedPw });
      if (res.ok) {
        PRODUCTS = res.products;
        TIER_LABEL = res.tierLabel;
        showCatalog();
      } else {
        sessionStorage.removeItem('artime_pw');
      }
    } catch (e) { /* stay on gate */ }
  }
  document.getElementById('pwInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });
})();
</script>
</body>
</html>
