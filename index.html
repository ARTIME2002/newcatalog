<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTIME — Handcrafted Wall Clocks</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- GATE -->
<div class="gate-wrap" id="gateWrap">
  <div class="gate-card">
    <img src="images/logo.jpg" class="gate-logo" alt="ARTIME">
    <div class="gate-title">Fine Handcrafted Clocks</div>
    <h1 class="gate-sub">Enter your access code</h1>
    <input type="password" id="pwInput" placeholder="Access code" autocomplete="off">
    <button onclick="tryLogin()">View Catalog</button>
    <div class="gate-error" id="gateError"></div>
    <div class="gate-footer">Enter the access code shared with you to view the catalog.</div>
  </div>
</div>

<!-- CATALOG -->
<div id="catalogWrap" style="display:none;">
  <header class="site-header">
    <div class="header-top">
      <div class="brand">
        <img src="images/logo.jpg" alt="ARTIME">
        <div class="names">
          <div class="collection">Fine Handcrafted Clocks</div>
          <div class="company">ARTIME</div>
        </div>
      </div>
      <div class="header-right">
        <button class="logout-btn" onclick="logout()">Switch code</button>
      </div>
    </div>
    <nav class="cat-tabs" id="catTabs"></nav>
  </header>

  <div class="toolbar">
    <input type="search" id="searchBox" placeholder="Search products…" oninput="render()">
    <select id="finishFilter" onchange="render()"></select>
    <select id="patternFilter" onchange="render()"></select>
    <select id="sizeFilter" onchange="render()"></select>
    <button class="btn-link" onclick="copyCategoryLink()">🔗 Copy link of this category</button>
  </div>
  <p class="result-count" id="resultCount"></p>

  <div class="catalog-grid" id="grid"></div>
</div>

<!-- CART BAR -->
<div class="cart-bar" id="cartBar">
  <div class="cart-bar-info"><span id="cartCount">0 items</span> · <span id="cartBarTotal">₹0</span></div>
  <button class="btn-view-order" onclick="openCartReview()">View & Place Order</button>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
  <button class="lightbox-nav prev" onclick="navLightbox(event,-1)">&#8249;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav next" onclick="navLightbox(event,1)">&#8250;</button>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<!-- ORDER REVIEW MODAL -->
<div class="order-modal" id="orderModal">
  <div class="order-modal-card">
    <div class="order-modal-header">
      <h2>Review your order</h2>
      <button class="order-close" onclick="closeOrderReview()">&times;</button>
    </div>
    <div class="order-modal-body" id="orderReviewBody"></div>
    <div class="order-modal-footer">
      <div class="order-total" id="orderTotal"></div>
      <button class="btn-whatsapp" onclick="sendOrderToWhatsApp()">Send order on WhatsApp</button>
    </div>
  </div>
</div>
<div class="added-toast" id="addedToast"></div>

<script src="app.js"></script>
<script>
let PRODUCTS = [];
let TIER_LABEL = "";
let CURRENT_COLLECTION = "";          // "" = All
let REQUESTED_COLLECTION = new URLSearchParams(location.search).get('collection') || "";
let lightboxImages = [];
let lightboxIndex = 0;
let CART = [];

/* ---------- Cart state ---------- */
function loadCart() { try { CART = JSON.parse(sessionStorage.getItem('artime_cart') || '[]'); } catch (e) { CART = []; } }
function saveCart() { sessionStorage.setItem('artime_cart', JSON.stringify(CART)); }
function cartTotal() { return CART.reduce((s, i) => s + i.price * i.qty, 0); }
function updateCartBar() {
  const bar = document.getElementById('cartBar');
  const count = CART.reduce((n, i) => n + i.qty, 0);
  if (count === 0) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  document.getElementById('cartCount').textContent = `${count} item${count !== 1 ? 's' : ''}`;
  document.getElementById('cartBarTotal').textContent = money(cartTotal()) + ' + GST';
}

/* ---------- Login ---------- */
async function tryLogin() {
  const pw = document.getElementById('pwInput').value.trim();
  const errEl = document.getElementById('gateError');
  errEl.textContent = '';
  if (!pw) { errEl.textContent = 'Please enter your access code.'; return; }
  errEl.textContent = 'Checking…';
  try {
    const res = await apiPost('/login', { password: pw });
    if (!res.ok) { errEl.textContent = res.error || 'Incorrect code.'; return; }
    PRODUCTS = res.products;
    TIER_LABEL = res.tierLabel;
    sessionStorage.setItem('artime_pw', pw);
    showCatalog();
  } catch (e) {
    errEl.textContent = 'Could not reach the server. Please try again.';
  }
}
function logout() { sessionStorage.removeItem('artime_pw'); location.reload(); }

/* ---------- Category tabs ---------- */
function collectionNames() {
  return [...new Set(PRODUCTS.map(p => p.collection).filter(Boolean))];
}
function renderTabs() {
  const names = collectionNames();
  const tabs = [{ label: 'All', value: '', count: PRODUCTS.length }]
    .concat(names.map(n => ({ label: n.replace(/ Collection$/i, ''), value: n, count: PRODUCTS.filter(p => p.collection === n).length })));
  document.getElementById('catTabs').innerHTML = tabs.map(t =>
    `<button class="cat-tab ${t.value === CURRENT_COLLECTION ? 'active' : ''}" data-v="${esc(t.value)}">${esc(t.label)} <span class="cat-count">${t.count}</span></button>`
  ).join('');
  document.querySelectorAll('.cat-tab').forEach(b => b.addEventListener('click', () => selectCollection(b.dataset.v)));
}
function selectCollection(value) {
  CURRENT_COLLECTION = value;
  const url = new URL(location.href);
  if (value) url.searchParams.set('collection', value); else url.searchParams.delete('collection');
  history.replaceState(null, '', url.toString());
  document.getElementById('searchBox').value = '';
  renderTabs();
  populateFilters();
  render();
}
function copyCategoryLink() {
  const url = new URL(location.origin + location.pathname);
  if (CURRENT_COLLECTION) url.searchParams.set('collection', CURRENT_COLLECTION);
  const text = url.toString();
  const done = () => showAddedToast('Link copied');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => prompt('Copy this link:', text));
  else prompt('Copy this link:', text);
}

/* ---------- Filters ---------- */
function visibleBase() {
  return PRODUCTS.filter(p => !CURRENT_COLLECTION || p.collection === CURRENT_COLLECTION);
}
function fillSelect(id, allLabel, values) {
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
}
function populateFilters() {
  const base = visibleBase();
  fillSelect('finishFilter', 'All finishes', [...new Set(base.map(p => p.finish))].sort());
  fillSelect('patternFilter', 'All patterns', [...new Set(base.map(p => p.pattern))].sort());
  fillSelect('sizeFilter', 'All sizes', [...new Set(base.map(p => p.size))].sort());
}

/* ---------- Render ---------- */
function render() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const fF = document.getElementById('finishFilter').value;
  const pF = document.getElementById('patternFilter').value;
  const sF = document.getElementById('sizeFilter').value;

  const items = visibleBase().filter(p => {
    if (fF && p.finish !== fF) return false;
    if (pF && p.pattern !== pF) return false;
    if (sF && p.size !== sF) return false;
    if (q && !(p.title.toLowerCase().includes(q) || p.code.toLowerCase().includes(q))) return false;
    return true;
  });
  document.getElementById('resultCount').textContent = `${items.length} product${items.length !== 1 ? 's' : ''}`;

  const grid = document.getElementById('grid');
  if (items.length === 0) { grid.innerHTML = '<div class="empty-state">No products match your search.</div>'; return; }

  grid.innerHTML = items.map(p => {
    const [hero, t1, t2] = p.images;
    const sid = p.code.replace(/[^a-zA-Z0-9]/g, '_');
    return `
    <div class="product-card">
      <div class="product-hero" onclick="openLightboxFor('${p.code}', 0)">
        <img src="${esc(hero || '')}" alt="${esc(p.title)}" loading="lazy">
        <div class="zoom-hint">🔍 Click to zoom</div>
      </div>
      <div class="product-body">
        <div class="product-eyebrow">${esc(p.collection)} · ${esc(p.code)}</div>
        <h3 class="product-title">${esc(p.title)}</h3>
        <p class="product-desc">${esc(p.description)}</p>
        <div class="chip-row">
          <span class="chip">Size: ${esc(p.size)}</span>
          <span class="chip">${esc(p.finish)}</span>
        </div>
        <div class="price-row">${money(p.price)} <span class="gst">+ GST</span></div>
        <div class="highlights-label">Product Highlights</div>
        <ul class="highlights-list">${p.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
        <div class="thumb-row">
          ${t1 ? `<img src="${esc(t1)}" alt="detail" onclick="openLightboxFor('${p.code}', 1)">` : ''}
          ${t2 ? `<img src="${esc(t2)}" alt="detail" onclick="openLightboxFor('${p.code}', 2)">` : ''}
        </div>
        <div class="order-row">
          <label class="qty-label">Qty <input type="number" min="1" value="1" class="qty-input" id="qty_${sid}"></label>
          <button class="btn-order" onclick="addToCart('${p.code}')">Add</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ---------- Cart flow ---------- */
function addToCart(code) {
  const p = PRODUCTS.find(x => x.code === code);
  if (!p) return;
  const sid = code.replace(/[^a-zA-Z0-9]/g, '_');
  let qty = parseInt(document.getElementById('qty_' + sid).value, 10);
  if (!qty || qty < 1) qty = 1;
  const existing = CART.find(i => i.code === code);
  if (existing) existing.qty += qty;
  else CART.push({ code: p.code, title: p.title, size: p.size, finish: p.finish, price: p.price, qty });
  saveCart(); updateCartBar();
  showAddedToast(`${p.title} added`);
}
function showAddedToast(msg) {
  const t = document.getElementById('addedToast');
  t.textContent = '✓ ' + msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function removeFromCart(code) {
  CART = CART.filter(i => i.code !== code);
  saveCart(); updateCartBar();
  if (CART.length === 0) { closeOrderReview(); return; }
  renderCartReview();
}
function updateCartQty(code, val) {
  let qty = parseInt(val, 10);
  if (!qty || qty < 1) qty = 1;
  const item = CART.find(i => i.code === code);
  if (item) item.qty = qty;
  saveCart(); updateCartBar(); renderCartReview();
}
function openCartReview() {
  if (CART.length === 0) return;
  renderCartReview();
  document.getElementById('orderModal').classList.add('open');
}
function renderCartReview() {
  document.getElementById('orderReviewBody').innerHTML = CART.map(o => `
    <div class="order-line">
      <div class="order-line-main">
        <div class="order-line-title">${esc(o.title)}</div>
        <div class="order-line-meta">${esc(o.finish)} · ${esc(o.size)} · Code: ${esc(o.code)}</div>
      </div>
      <div class="order-line-qty">Qty: <input type="number" min="1" value="${o.qty}" onchange="updateCartQty('${o.code}', this.value)"></div>
      <div class="order-line-price">${money(o.price * o.qty)} + GST</div>
      <button class="order-line-remove" onclick="removeFromCart('${o.code}')" title="Remove">&times;</button>
    </div>`).join('');
  document.getElementById('orderTotal').textContent = 'Total: ' + money(cartTotal()) + ' + GST';
}
function closeOrderReview() { document.getElementById('orderModal').classList.remove('open'); }
function sendOrderToWhatsApp() {
  if (CART.length === 0) return;
  const lines = [`Hi ARTIME, I'd like to place an order:`, ``];
  CART.forEach((o, i) => {
    lines.push(`${i + 1}. ${o.title}`);
    lines.push(`   Finish: ${o.finish} | Size: ${o.size} | Code: ${o.code}`);
    lines.push(`   Quantity: ${o.qty} × ${money(o.price)} = ${money(o.price * o.qty)} + GST`);
    lines.push(``);
  });
  lines.push(`Grand Total: ${money(cartTotal())} + GST`);
  lines.push(``);
  lines.push(`(Sent from the ${TIER_LABEL} catalog)`);
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
  CART = []; saveCart(); updateCartBar(); closeOrderReview();
}

/* ---------- Lightbox ---------- */
function openLightboxFor(code, idx) {
  const p = PRODUCTS.find(x => x.code === code);
  if (!p) return;
  const imgs = p.images.filter(Boolean);
  if (!imgs.length) return;
  lightboxImages = imgs;
  lightboxIndex = Math.min(idx, imgs.length - 1);
  lightboxTitle = p.title;
  showLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.querySelectorAll('.lightbox-nav').forEach(b => b.style.display = imgs.length > 1 ? 'flex' : 'none');
}
let lightboxTitle = '';
function showLightbox() {
  document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
  document.getElementById('lightboxCaption').textContent = `${lightboxTitle} — photo ${lightboxIndex + 1} of ${lightboxImages.length}`;
}
function closeLightbox(e) {
  if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-close'))
    document.getElementById('lightbox').classList.remove('open');
}
function navLightbox(e, dir) {
  e.stopPropagation();
  lightboxIndex = (lightboxIndex + dir + lightboxImages.length) % lightboxImages.length;
  showLightbox();
}
document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (lb.classList.contains('open')) {
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowRight') navLightbox(e, 1);
    if (e.key === 'ArrowLeft') navLightbox(e, -1);
  }
  if (e.key === 'Escape' && document.getElementById('orderModal').classList.contains('open')) closeOrderReview();
});

/* ---------- Boot ---------- */
function showCatalog() {
  document.getElementById('gateWrap').style.display = 'none';
  document.getElementById('catalogWrap').style.display = 'block';
  // honour ?collection=... link (case-insensitive match)
  const match = collectionNames().find(n => n.toLowerCase() === REQUESTED_COLLECTION.toLowerCase());
  CURRENT_COLLECTION = match || "";
  renderTabs();
  populateFilters();
  render();
}
(async function init() {
  loadCart(); updateCartBar();
  const savedPw = sessionStorage.getItem('artime_pw');
  if (savedPw) {
    try {
      const res = await apiPost('/login', { password: savedPw });
      if (res.ok) { PRODUCTS = res.products; TIER_LABEL = res.tierLabel; showCatalog(); }
      else sessionStorage.removeItem('artime_pw');
    } catch (e) { /* stay on gate */ }
  }
  document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
})();
</script>
</body>
</html>
